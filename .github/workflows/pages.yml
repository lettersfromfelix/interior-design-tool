# Builds the website and publishes it on GitHub Pages: https://lettersfromfelix.github.io/interior-design-tool/
# Runs on every push to main (and by hand from the Actions tab). The data files are checked first; if any check
# fails, the website keeps its previous version.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Validate data, catalogue and layouts
        run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Build the website
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
